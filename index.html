<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15212e">
    <meta
      name="description"
      content="Metro Map Maker is a powerful browser-based tool for designing clean transit maps with lines, stations, labels, themes, and exports."
    >
    <title>Metro Map Maker v0.5.5</title>
    <link rel="stylesheet" href="styles.css?v=0.5.5">
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Metro map controls">
        <header class="brand-panel">
          <div>
            <p class="eyebrow">Metro Map Maker</p>
            <h1>Design Console</h1>
          </div>
          <span class="version-badge">v0.5.5</span>
        </header>

        <section class="control-section" aria-labelledby="tool-heading">
          <div class="section-heading">
            <h2 id="tool-heading">Tools</h2>
            <span id="statusText" class="status-pill">Ready</span>
          </div>
          <div class="segmented" role="group" aria-label="Drawing mode">
            <button class="segment is-active" type="button" data-tool="select" title="Select stations and line segments">Select</button>
            <button class="segment" type="button" data-tool="station" title="Add standalone stations">Add</button>
            <button class="segment" type="button" data-tool="connect" title="Connect two stations with the active line">Connect</button>
          </div>
          <div class="button-row">
            <button id="undoButton" class="ghost-button" type="button" title="Undo last action">Undo</button>
            <button id="clearButton" class="danger-button" type="button" title="Clear the whole map">Clear</button>
          </div>
          <div class="button-row">
            <button id="zoomInButton" class="ghost-button" type="button" title="Zoom in">Zoom +</button>
            <button id="zoomOutButton" class="ghost-button" type="button" title="Zoom out">Zoom -</button>
          </div>
        </section>

        <section class="control-section" aria-labelledby="line-heading">
          <div class="section-heading">
            <h2 id="line-heading">Line</h2>
            <button id="addLineButton" class="icon-text-button" type="button">Add Line</button>
          </div>
          <label class="field">
            <span>Name</span>
            <input id="lineNameInput" type="text" maxlength="28" autocomplete="off">
          </label>
          <label class="field">
            <span>Color</span>
            <input id="lineColorInput" type="color">
          </label>
          <p id="lineHint" class="hint">Select a line, name it, then connect two stations.</p>
          <div id="lineList" class="line-list" aria-label="Metro lines"></div>
        </section>

        <section class="control-section" aria-labelledby="station-heading">
          <div class="section-heading">
            <h2 id="station-heading">Station</h2>
            <button id="addStationButton" class="icon-text-button" type="button">Add Station</button>
          </div>
          <label class="field">
            <span>Name</span>
            <input id="stationNameInput" type="text" maxlength="32" autocomplete="off">
          </label>
          <div id="interchangeRotationRow" class="button-row" style="display:none">
            <div class="segmented" role="group" aria-label="Interchange orientation" style="grid-column: 1 / -1; grid-template-columns: repeat(2, 1fr)">
              <button class="segment is-active" type="button" data-rotation="horizontal">Horizontal</button>
              <button class="segment" type="button" data-rotation="vertical">Vertical</button>
            </div>
          </div>
          <div class="button-row">
            <button id="deleteStationButton" class="danger-button" type="button" style="grid-column: 1 / -1">Delete</button>
          </div>
          <p id="selectionHint" class="hint">Selection details appear here.</p>
        </section>

        <section class="control-section" aria-labelledby="style-heading">
          <h2 id="style-heading">Style</h2>
          <label class="toggle">
            <input id="gridToggle" type="checkbox" checked>
            <span>Grid</span>
          </label>
          <label class="toggle">
            <input id="labelsToggle" type="checkbox" checked>
            <span>Station labels</span>
          </label>
          <label class="field">
            <span>Map title</span>
            <input id="mapTitleInput" type="text" maxlength="36" autocomplete="off">
          </label>
        </section>

        <section class="control-section" aria-labelledby="export-heading">
          <h2 id="export-heading">Export</h2>
          <div class="button-grid">
            <button id="exportPngButton" class="ghost-button" type="button">PNG</button>
            <button id="exportJsonButton" class="ghost-button" type="button">JSON</button>
            <button id="loadDemoButton" class="ghost-button" type="button">Demo</button>
          </div>
        </section>

        <section class="control-section" aria-labelledby="import-heading">
          <h2 id="import-heading">Import</h2>
          <button id="importJsonButton" class="drop-zone" type="button">
            <strong>Drop JSON here</strong>
            <span>or choose a map file</span>
          </button>
          <input id="importJsonInput" class="sr-only" type="file" accept="application/json,.json">
        </section>
      </aside>

      <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-label="Resize toolbar" aria-orientation="vertical" tabindex="0"></div>

      <section class="workspace" aria-label="Metro map workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Workspace</p>
            <h2 id="mapTitleDisplay">Harbor Loop Draft</h2>
          </div>
          <div class="topbar-actions">
            <div class="metrics" aria-label="Map metrics">
              <span><strong id="stationCount">0</strong> stations</span>
              <span><strong id="lineCount">0</strong> lines</span>
              <span><strong id="connectionCount">0</strong> segments</span>
            </div>
            <div class="display-controls">
              <button id="settingsButton" class="icon-button" type="button" aria-label="Display settings" aria-expanded="false">Settings</button>
              <div class="appearance-switch" role="group" aria-label="Appearance">
                <button class="appearance-option is-active" type="button" data-appearance="system">System</button>
                <button class="appearance-option" type="button" data-appearance="light">Light</button>
                <button class="appearance-option" type="button" data-appearance="dark">Dark</button>
              </div>
            </div>
            <div id="settingsPanel" class="settings-panel" hidden>
              <label class="field">
                <span>Line Turn Radius (units)</span>
                <div class="settings-range-row">
                  <input id="lineTurnRadiusInput" type="range" min="0" max="120" step="0.1">
                  <output id="lineTurnRadiusValue" for="lineTurnRadiusInput">0 units</output>
                </div>
              </label>
            </div>
          </div>
        </header>

        <div class="canvas-frame">
          <svg id="mapCanvas" role="img" aria-label="Interactive metro map canvas" viewBox="0 0 1200 760"></svg>
        </div>
      </section>
    </main>

    <template id="lineButtonTemplate">
      <button class="line-chip" type="button">
        <span class="swatch"></span>
        <span class="line-chip-name"></span>
      </button>
    </template>

    <script src="app.js?v=0.5.5"></script>
  </body>
</html>
